<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>엘리베이터 도착 시간</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="elevator">

  <div class="screen">
    <div id="arrow" class="arrow">▲</div>
    <div id="floorNumber" class="floor">1</div>
    <div id="arrivalText" class="arrival">대기 중</div>
  </div>

  <select id="targetFloor">
    <option value="1">1층</option>
    <option value="2">2층</option>
    <option value="3">3층</option>
    <option value="4">4층</option>
    <option value="5">5층</option>
    <option value="6">6층</option>
    <option value="7">7층</option>
    <option value="8">8층</option>
  </select>

  <button onclick="callElevator('up')">▲</button>
  <button onclick="callElevator('down')">▼</button>

</div>

<script src="script.js"></script>
</body>
</html>
