<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엘리베이터 대기 시간 안내 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="current-floor-box">4층</div>

        <div class="panel">
            
            <div class="display">
                <div class="direction" id="display-direction">↑</div>
                <div class="floor" id="display-floor">12</div>
                
                <div class="arrival-time-text" id="arrival-time-display"></div>
            </div>

            <div class="buttons-area">
                <button id="up-btn" class="elevator-btn">
                    <svg viewBox="0 0 100 100"><polygon points="50,15 85,85 15,85"/></svg>
                </button>
                <button id="down-btn" class="elevator-btn">
                    <svg viewBox="0 0 100 100"><polygon points="15,15 85,15 50,85"/></svg>
                </button>
            </div>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
