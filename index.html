<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 엘리베이터 호출 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="current-floor-box">
            <span class="label">CURRENT FLOOR</span>
            <span class="floor-num">4F</span>
        </div>

        <div class="panel">
            <div class="panel-front">
                <div class="screw top"></div>
                
                <div class="display-container">
                    <div class="display-glass">
                        <div class="direction" id="display-direction">─</div>
                        <div class="floor" id="display-floor">01</div>
                        <div class="arrival-time-text" id="arrival-time-display"></div>
                    </div>
                </div>

                <div class="buttons-area">
                    <button id="up-btn" class="elevator-btn" aria-label="Up">
                        <svg viewBox="0 0 100 100"><polygon points="50,20 85,80 15,80"/></svg>
                    </button>
                    <button id="down-btn" class="elevator-btn" aria-label="Down">
                        <svg viewBox="0 0 100 100"><polygon points="15,20 85,20 50,80"/></svg>
                    </button>
                </div>
                
                <div class="screw bottom"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
