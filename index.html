<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리얼 프리미엄 엘리베이터 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="user-floor-selector">
        <label for="floor-select">현재 내 위치 :</label>
        <select id="floor-select">
            <option value="1">1층</option>
            <option value="2">2층</option>
            <option value="3">3층</option>
            <option value="4" selected>4층</option>
            <option value="5">5층</option>
            <option value="6">6층</option>
            <option value="7">7층</option>
            <option value="8">8층</option>
        </select>
    </div>

    <div class="elevator-panel">
        <div class="screw top"></div>
        
        <div class="led-display">
            <div class="direction-arrow" id="arrow">─</div>
            <div class="floor-number" id="floor-num">01</div>
            <div class="countdown-text" id="countdown-display"></div>
        </div>

        <div class="button-container">
            <button id="btn-up" class="action-button">
                <svg viewBox="0 0 100 100"><polygon points="50,18 88,82 12,82"/></svg>
            </button>
            <button id="btn-down" class="action-button">
                <svg viewBox="0 0 100 100"><polygon points="12,18 88,18 50,82"/></svg>
            </button>
        </div>

        <div class="screw bottom"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
