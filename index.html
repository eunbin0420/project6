<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>엘리베이터 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="current-floor">현재 위치: 1층</div>

    <div class="panel">
        <div class="display">
            <div class="direction" id="display-direction">&uarr;</div>
            <div class="floor" id="display-floor">12</div>
        </div>

        <div class="wait-time-display" id="wait-time">--초</div>

        <div class="buttons">
            <button id="up-btn">
                <svg viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90"/></svg>
            </button>
            <button id="down-btn">
                <svg viewBox="0 0 100 100"><polygon points="10,10 90,10 50,90"/></svg>
            </button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
